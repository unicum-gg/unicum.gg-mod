name: client-files
description: >-
  The live client's .swc and battleVehicleMarkersApp.swf, off the update CDN,
  with a manifest.json naming the build, its mods folder and a sha256 per file.

# Read with unicum-gg/wot.build's own reader, the one that already rebuilds the
# client's packages for the wot.assets mirror: it replays every patch the CDN
# published since the full install, so what it writes is the build players are
# running, not the one the last full install was cut at. About three minutes.
inputs:
  out:
    description: Where to write the files.
    default: build/client-files
outputs:
  mods:
    description: The mods folder the live client reads, e.g. 2.4.1.1.
    value: ${{ steps.read.outputs.mods }}
  build:
    description: The build number, e.g. 2.4.1.5514.
    value: ${{ steps.read.outputs.build }}

runs:
  using: composite
  steps:
    - name: Install 7-Zip and the delta decoders
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full xdelta3 rdiff

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - uses: actions/checkout@v4
      with:
        repository: unicum-gg/wot.build
        path: .wot.build
        persist-credentials: false

    - name: Read the client off the CDN
      id: read
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -eu
        out="$GITHUB_WORKSPACE/$OUT"
        (cd .wot.build && npm ci --no-audit --no-fund && npm run client-files -- --out "$out")
        echo "mods=$(jq -r .mods "$out/manifest.json")" >> "$GITHUB_OUTPUT"
        echo "build=$(jq -r .versionName "$out/manifest.json")" >> "$GITHUB_OUTPUT"
