name: client

# Watches the live client and says so when it moves past what we published.
#
# It used to build and publish by itself. It cannot, and this is measured, not
# cautious: the two client files the AS3 build needs come from a mirror that
# carries a different build of them. On 2026-10-14 the live client's
# battleVehicleMarkersApp.swf was 303622 bytes and the mirror's 300743, the
# whole 2879-byte difference inside the DoABC tag. That file ships inside the
# .wotmod and REPLACES the client's own, so a package built here hands every
# player the vehicle markers of a build they are not running. The release is
# cut on a machine with the game installed (tools/release.py), and this job's
# whole output is a heads-up that it is time to.
#
# It also used to get the comparison wrong in a way that was worse than
# useless. `[ "$live" != "$shipped" ]` reads "the package is AHEAD of the
# mirror" as "the client moved", so on the morning of 2026-10-14, with the
# mirror a build behind and 0.5.0 already out for 2.4.1.0, it was about to
# publish a 0.5.1 aimed at mods/2.4.0.2 -- the folder the client had just
# stopped reading. Versions are ordered here, and only a live client NEWER
# than what we shipped is news.
#
# Where the two versions come from:
#
#   live     two independent sources that have to be read together:
#            izeberg/wot-src, the upstream our own mirror forks, whose EU
#            branch carries the client's paths.xml; and the Mod Hub's public
#            page, which lists the versions a mod may be published for,
#            newest first, and needs no session. A mirror can lag, so when
#            they disagree the newer one is the live client and the lag
#            itself is worth saying.
#   shipped  the folder inside the newest PUBLISHED release's zip, read back
#            from the release rather than from a number written down
#            somewhere that can drift. Drafts are excluded: a draft sat at
#            the top of this list for ten days and poisoned the comparison.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: client
  cancel-in-progress: false

jobs:
  check:
    # A fork's cron should not open issues on the fork.
    if: github.repository == 'unicum-gg/unicum.gg-mod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare the live client with the one we published for
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          # Name the repository explicitly for every gh command.
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu

          # The upstream mirror of the client's own paths.xml.
          paths=https://raw.githubusercontent.com/izeberg/wot-src/EU/sources/paths.xml
          upstream=$(curl -fsSL --retry 2 "$paths" \
            | grep -oE '\./mods/[0-9][0-9.]*' | head -1 | sed 's|\./mods/||' || true)

          # The hub's public page carries the list in a JS string literal, so
          # every quote arrives as the six characters ". The pattern has to
          # include that prefix and strip it afterwards: matching the version
          # alone makes the trailing 0022 of the opening quote part of the
          # match, and yields 00222.4.1.0.
          hub=$(curl -fsSL --retry 2 -A unicum.gg-client-watch https://wgmods.net/ \
            | grep -o 'u0022gameVersions[^]]*]' | head -1 \
            | grep -oE 'u0022[0-9]+(\.[0-9]+){3}' | head -1 | sed 's/^u0022//' || true)

          if [ -z "$upstream" ] && [ -z "$hub" ]; then
            echo "neither source answered; nothing can be concluded" >&2
            exit 1
          fi
          # The newer of whatever answered is the live client.
          live=$(printf '%s\n%s\n' "$upstream" "$hub" | grep -v '^$' | sort -V | tail -1)

          tag=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "no published release to compare against; nothing to do"
            echo "news=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf shipped && mkdir shipped
          gh release download "$tag" --pattern '*.zip' --dir shipped
          shipped=$(unzip -Z1 shipped/*.zip | grep -oE '^mods/[0-9][0-9.]*' | head -1 | sed 's|mods/||')

          echo "upstream mirror  ${upstream:-no answer}"
          echo "hub page         ${hub:-no answer}"
          echo "live client      $live"
          echo "published for    $shipped (in $tag)"
          {
            echo "upstream=$upstream"
            echo "hub=$hub"
            echo "live=$live"
            echo "shipped=$shipped"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          # Only a live client NEWER than the published package is news. Equal
          # means we are current; the package being ahead means the mirrors
          # have not caught up with a release we already cut, which is normal
          # for a day or so and is not a reason to do anything.
          newest=$(printf '%s\n%s\n' "$live" "$shipped" | sort -V | tail -1)
          if [ "$live" = "$shipped" ] || [ "$newest" = "$shipped" ]; then
            echo "news=no" >> "$GITHUB_OUTPUT"
          else
            echo "news=yes" >> "$GITHUB_OUTPUT"
          fi

          # A disagreement between the two sources is worth reporting even when
          # there is nothing to do, because it is the shape of a stale mirror.
          if [ -n "$upstream" ] && [ -n "$hub" ] && [ "$upstream" != "$hub" ]; then
            echo "disagree=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Say that a release is due
        if: steps.compare.outputs.news == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LIVE: ${{ steps.compare.outputs.live }}
          SHIPPED: ${{ steps.compare.outputs.shipped }}
          TAG: ${{ steps.compare.outputs.tag }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          HUB: ${{ steps.compare.outputs.hub }}
        # The values go through the environment, never interpolated into the
        # script: a workflow that pastes an input into bash runs whatever that
        # input happens to contain.
        run: python3 tools/client_issue.py

      - name: Say so in the summary
        if: always()
        env:
          NEWS: ${{ steps.compare.outputs.news }}
          DISAGREE: ${{ steps.compare.outputs.disagree }}
          LIVE: ${{ steps.compare.outputs.live }}
          SHIPPED: ${{ steps.compare.outputs.shipped }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          HUB: ${{ steps.compare.outputs.hub }}
        run: |
          set -eu
          if [ "${NEWS:-}" = "yes" ]; then
            echo "Client $LIVE is live; published for $SHIPPED. A release is due." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${NEWS:-}" = "no" ]; then
            echo "The published package targets the live client ($LIVE)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The comparison did not complete; neither version is known." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${DISAGREE:-}" = "yes" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The two sources disagree: upstream mirror \`$UPSTREAM\`, hub page \`$HUB\`. One of them is behind." >> "$GITHUB_STEP_SUMMARY"
          fi
