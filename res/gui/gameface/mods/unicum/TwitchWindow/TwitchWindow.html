<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>unicum.gg Twitch window</title>
        <style>
            /* The page is the window, and the window is the panel's size. The
               panel is placed absolutely, so without a size of its own the
               body is empty, and Gameface clips the panel to it. */
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: transparent;
                font-size: 14rem;
            }

            /* What every page of the game starts with (its shared lib.css),
               and the hangar the panel was made in with it: the same font,
               weight and spacing, and the game's own font for the languages
               PFDINMax has no letters for, told by the <html>'s lang, which
               TwitchWindow.js sets. */
            body, button, input {
                font-family: PFDINMax;
                font-weight: 400;
                letter-spacing: 0.02em;
            }

            html[lang=ja] body, html[lang=ko] body, html[lang=zh_tw] body, html[lang=zh_sg] body,
            html[lang=zh_cn] body, html[lang=vi] body, html[lang=th] body,
            html[lang=ja] button, html[lang=ko] button, html[lang=zh_tw] button, html[lang=zh_sg] button,
            html[lang=zh_cn] button, html[lang=vi] button, html[lang=th] button,
            html[lang=ja] input, html[lang=ko] input, html[lang=zh_tw] input, html[lang=zh_sg] input,
            html[lang=zh_cn] input, html[lang=vi] input, html[lang=th] input {
                font-family: Warhelios;
                letter-spacing: 0;
            }
        </style>
    </head>
    <body>
        <!-- The window holds the garage's Twitch panel, which TwitchWindow.js
             loads and builds itself. -->
        <script type="module" src="TwitchWindow.js"></script>
    </body>
</html>
